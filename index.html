<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tema: aplica la preferencia guardada antes del primer pintado (sin parpadeo).
         Modo claro es el principal; solo se activa oscuro si el usuario lo eligió. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <title>Iván Santiago Duarte — Marketing, diseño y producto con IA</title>
    <meta name="description" content="Especialista en marketing digital con +6 años ayudando a marcas a crecer. Google & Meta Ads, SEO, e-commerce, branding y productos digitales con IA. Bogotá, Colombia." />

    <!-- Open Graph -->
    <meta property="og:title" content="Iván Santiago Duarte — Marketing, diseño y producto con IA" />
    <meta property="og:description" content="Estrategia, diseño y producto digital que mueve números. +278% en ventas, 24+ marcas, +6 años." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist (principal, estilo SF/Apple) + Instrument Serif (acento itálico) +
         Space Mono (etiquetas). Carga no bloqueante para mejor primer pintado. -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=Space+Mono&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=Space+Mono&display=swap"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=Space+Mono&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
